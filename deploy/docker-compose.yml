# VILNO на виділеному VPS: окремий compose-проєкт `vilno`.
#   cd deploy && docker compose up -d --build
# Публічна HTTPS-адреса — cloudflared quick tunnel (*.trycloudflare.com), без домену й токена.
# Увага: адреса тунелю змінюється при кожному перезапуску контейнера `tunnel`.
name: vilno

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: vilno-api:latest
    restart: unless-stopped
    env_file: .env.prod            # PLATE_HMAC_KEY, DEMO_TOKEN та ін. Лише на сервері, не в git
    environment:
      DATABASE_URL: sqlite:////srv/vilno/var/vilno.db
    volumes:
      - vilno-data:/srv/vilno/var  # SQLite переживає перезапуск і перезбірку
    ports:
      - "127.0.0.1:8090:8000"      # лише для curl з самого VPS; ззовні — тільки через тунель
    mem_limit: 2g                  # CV (YOLO + fast-alpr) ≈ 0,6 ГБ на Mac; на Linux з torch — з запасом
    stop_grace_period: 10s

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m

volumes:
  vilno-data:
